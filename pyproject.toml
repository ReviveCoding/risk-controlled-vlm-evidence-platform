[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-controlled-vlm-evidence-platform"
version = "0.7.1"
description = "Reliability-first evidence assessment, transactional publication, review-policy qualification, and bounded API serving"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Jinwoo Bae"}]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "pydantic>=2.8,<3",
  "numpy>=2.0,<3",
  "pandas>=2.1,<3",
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "scikit-learn==1.8.0",
  "scipy>=1.11,<2",
  "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
api = ["fastapi>=0.137,<1", "uvicorn>=0.30,<1", "httpx2>=2.4,<3"]
api-legacy = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = [
  "bandit[toml]>=1.9,<2",
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "setuptools>=75",
  "types-PyYAML>=6.0,<7",
  "wheel>=0.44",
]
vlm = ["torch>=2.5", "transformers>=4.57", "pillow>=10"]
datasets = ["py7zr>=1,<2", "pyarrow>=18,<24"]
ml = ["scikit-learn==1.8.0"]
parquet = ["pyarrow>=18,<24"]
qwen = ["sentence-transformers>=3,<6", "torch>=2.5,<3"]
mlflow = ["mlflow>=3,<4"]
databricks = ["databricks-sdk>=0.40,<1"]

[project.scripts]
control-evidence = "control_evidence.cli:main"
model-forge = "model_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_forge = ["resources/configs/*.yaml", "resources/configs/workloads/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["databricks: requires Databricks credentials"]

[tool.coverage.run]
branch = true
source = ["control_evidence", "model_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_error_summary = true
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
