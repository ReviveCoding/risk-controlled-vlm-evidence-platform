schema_version: "1.1"
dataset_id: cfpb_untimely_response
entity_key: complaint_id
event_time: date_sent_to_company
received_time: date_received
target: untimely_response
label_maturity_days: 60
allowed_target_values: [0, 1]
required_columns:
  - complaint_id
  - date_received
  - date_sent_to_company
  - product
  - sub_product
  - issue
  - sub_issue
  - company
  - submitted_via
  - complaint_narrative
  - untimely_response
audit_only: [state, tags]
forbidden_model_features:
  - company_response_to_consumer
  - timely_response
  - consumer_disputed
  - untimely_response
split:
  train: ["2019-01-01", "2023-12-31"]
  validation: ["2024-01-01", "2024-06-30"]
  calibration_policy: ["2024-07-01", "2024-12-31"]
  locked_final_test: ["2025-01-01", "2025-12-31"]
  prospective_stress: ["2026-01-01", "2026-12-31"]
